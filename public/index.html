<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>缓一缓 · 个人学术工作台</title>
  <meta name="description" content="安排学习任务、管理长期计划；思绪混乱时可以自然地聊一聊，确认之后把有用的部分变成待办。">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#5c4033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="缓一缓">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/workbench.css">
  <link rel="stylesheet" href="/css/study.css">
  <link rel="stylesheet" href="/css/reading.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%235c4033'/><text y='68' x='50' text-anchor='middle' font-size='54' fill='white' font-family='sans-serif'>缓</text></svg>">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main id="view"></main>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <noscript>
    <div style="padding:40px;font-family:sans-serif">
      这个页面需要 JavaScript 才能运行。请在浏览器设置里打开 JavaScript。
    </div>
  </noscript>

  <script>
    // 真 App（Capacitor）里页面由 WebView 本地加载，API 跑在 App 内的 Node 服务上。
    // 浏览器 / 桌面不设这个前缀，所有请求仍是同源相对路径。
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      window.WB_API_BASE = 'http://127.0.0.1:5180';
    }
  </script>
  <script type="module">
    // App 内要等 Node 运行时把本地服务拉起来再加载应用；浏览器里立即加载。
    const base = window.WB_API_BASE || '';
    const ready = base
      ? (async () => {
          for (let i = 0; i < 80; i += 1) {
            try { const r = await fetch(base + '/api/bootstrap'); if (r.ok) return; } catch (e) {}
            await new Promise((r) => setTimeout(r, 250));
          }
        })()
      : Promise.resolve();
    ready.then(() => import('/js/app.js'));
  </script>
  <script>
    // 手机端「添加到主屏幕」后才需要；只在 HTTPS / localhost 下生效。
    // 桌面 Electron 里也会注册，但缓存的是同一份静态资源，不影响数据。
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
